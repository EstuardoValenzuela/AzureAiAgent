<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat con Mr. T</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 400px;
            height: 600px;
            background: #ffffff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .message {
            margin-bottom: 15px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user {
            align-self: flex-end;
            background: #dcf8c6;
            padding: 10px;
            border-radius: 10px 10px 0 10px;
        }
        .assistant {
            align-self: flex-start;
            background: #f1f0f0;
            padding: 10px;
            border-radius: 10px 10px 10px 0;
        }
        .typing-indicator {
            font-size: 12px;
            color: gray;
            margin-top: 10px;
        }
        .input-container {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ccc;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 20px;
            background: #f0f2f5;
        }
        button {
            background: #009688;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            margin-left: 10px;
            cursor: pointer;
        }
        button:hover {
            background: #00796b;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <!-- Mensajes aparecerán aquí -->
        </div>
        <div class="typing-indicator" id="typingIndicator" style="display:none;">Mr. T está escribiendo...</div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje...">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            // Mostrar mensaje del usuario
            const chat = document.getElementById('chatMessages');
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = message;
            chat.appendChild(userMsg);
            chat.scrollTop = chat.scrollHeight;

            input.value = '';

            // Mostrar typing indicator
            const typing = document.getElementById('typingIndicator');
            typing.style.display = 'block';

            fetch('/send_message', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ user_input: message })
            })
            .then(response => response.json())
            .then(data => {
                typing.style.display = 'none'; // Ocultar typing indicator

                // Mostrar respuesta del asistente
                const assistantMsg = document.createElement('div');
                assistantMsg.className = 'message assistant';
                assistantMsg.innerHTML = data.assistant_response; // Usamos innerHTML para respetar links, bold, etc.
                chat.appendChild(assistantMsg);
                chat.scrollTop = chat.scrollHeight;
            })
            .catch(error => {
                typing.style.display = 'none';
                console.error('Error:', error);
            });
        }

        // Permitir enviar al presionar ENTER
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
